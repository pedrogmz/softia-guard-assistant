services:
  # backend + frontend corren en Docker.
  # Ollama corre NATIVO en el host (Apple Silicon/GPU): Docker en Mac no expone
  # la GPU/Metal, así que los contenedores hablan con el Ollama del host vía
  # host.docker.internal. (Para correr Ollama TAMBIÉN en Docker, ver el bloque
  # comentado al final — en Mac sería solo CPU y más lento.)

  backend:
    build: ./backend
    container_name: guard_assistant_backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434 # Ollama nativo en el host
      - LLM_MODEL=qwen2.5:7b-instruct
      - EMBED_MODEL=bge-m3
      - CHROMA_DIR=/app/chroma_db
      # STT local (Whisper). El modelo se descarga una vez y se cachea en el volumen.
      - WHISPER_MODEL=small
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_LANGUAGE=es
      - HF_HOME=/app/.hf_cache
    volumes:
      - ./backend:/app
      - ./data:/app/chroma_db # el vector store persiste entre reinicios
      - ./whisper_cache:/app/.hf_cache # cache del modelo Whisper (evita re-descargas)
    extra_hosts:
      - "host.docker.internal:host-gateway" # necesario en Linux; inofensivo en Mac/Windows

  frontend:
    build: ./frontend
    container_name: guard_assistant_frontend
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true # file watching dentro del contenedor
      - BACKEND_URL=http://backend:8000 # /api se proxya al servicio backend
    volumes:
      - ./frontend:/app
      - /app/node_modules # evita que el node_modules local pise el del contenedor
    depends_on:
      - backend

volumes:
  data:
  whisper_cache:
